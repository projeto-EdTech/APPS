<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vestibuline</title>
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    /* Fonte Apple-style */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    /* Animações personalizadas */
    @keyframes fadeInScale {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.95);
        filter: blur(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-20px);
      }
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 0.5;
      }
      50% {
        opacity: 1;
      }
    }

    @keyframes shimmer {
      0% {
        background-position: -1000px 0;
      }
      100% {
        background-position: 1000px 0;
      }
    }

    @keyframes spin-smooth {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes expandRing {
      0% {
        transform: scale(0.8);
        opacity: 0;
      }
      50% {
        opacity: 0.3;
      }
      100% {
        transform: scale(1.5);
        opacity: 0;
      }
    }

    @keyframes progressBar {
      0% {
        width: 0%;
      }
      20% {
        width: 30%;
      }
      40% {
        width: 50%;
      }
      60% {
        width: 70%;
      }
      80% {
        width: 85%;
      }
      100% {
        width: 100%;
      }
    }

    .animate-fade-in-scale {
      animation: fadeInScale 1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .animate-float {
      animation: float 4s ease-in-out infinite;
    }

    .animate-pulse-slow {
      animation: pulse 3s ease-in-out infinite;
    }

    .animate-shimmer {
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      background-size: 1000px 100%;
      animation: shimmer 2s infinite;
    }

    .animate-spin-smooth {
      animation: spin-smooth 2s cubic-bezier(0.4, 0.0, 0.2, 1) infinite;
    }

    .animate-expand-ring {
      animation: expandRing 2s ease-out infinite;
    }

    .animate-progress {
      animation: progressBar 3s ease-out forwards;
    }

    /* Delays progressivos */
    .delay-100 { animation-delay: 0.1s; }
    .delay-200 { animation-delay: 0.2s; }
    .delay-300 { animation-delay: 0.3s; }
    .delay-400 { animation-delay: 0.4s; }
    .delay-500 { animation-delay: 0.5s; }
    .delay-600 { animation-delay: 0.6s; }

    /* Gradientes personalizados */
    .gradient-purple {
      background: linear-gradient(135deg, #7431f6 0%, #5e27c9 100%);
    }

    .gradient-text {
      background: linear-gradient(135deg, #7431f6 0%, #5e27c9 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Elementos inicialmente escondidos */
    .fade-item {
      opacity: 0;
    }

    /* Loader customizado */
    .loader-ring {
      border: 4px solid rgba(116, 49, 246, 0.1);
      border-top-color: #7431f6;
      border-radius: 50%;
      animation: spin-smooth 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-center items-center bg-[#f5f5f7] overflow-hidden relative">
  
  <!-- Background decorativo - Estilo macOS -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <!-- Blob 1 - Superior Esquerdo -->
    <div class="absolute top-0 left-1/4 w-[600px] h-[600px] bg-blue-500/5 rounded-full blur-[120px] animate-pulse-slow"></div>
    
    <!-- Blob 2 - Inferior Direito -->
    <div class="absolute bottom-0 right-1/4 w-[600px] h-[600px] bg-purple-500/5 rounded-full blur-[120px] animate-pulse-slow delay-300"></div>
    
    <!-- Blob 3 - Centro -->
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[400px] h-[400px] bg-indigo-500/3 rounded-full blur-[100px] animate-pulse-slow delay-200"></div>
  </div>

  <!-- Container Principal -->
  <div class="relative z-10 flex flex-col items-center justify-center px-6 py-8">
    
    <!-- Logo/Ícone Container com efeitos -->
    <div class="relative mb-8 fade-item animate-fade-in-scale delay-100">
      
      <!-- Anéis expansivos de fundo -->
      <div class="absolute inset-0 flex items-center justify-center">
        <div class="w-40 h-40 rounded-full border-2 border-purple-400/20 animate-expand-ring"></div>
      </div>
      <div class="absolute inset-0 flex items-center justify-center">
        <div class="w-40 h-40 rounded-full border-2 border-blue-400/20 animate-expand-ring delay-100"></div>
      </div>
      
      <!-- Container do logo com float -->
      <div class="relative animate-float">
        <!-- Background gradient glow -->
        <div class="absolute inset-0 gradient-purple rounded-[24px] blur-xl opacity-30"></div>
        
        <!-- Logo principal -->
        <div class="relative w-32 h-32 md:w-40 md:h-40 rounded-[24px] bg-white shadow-2xl border border-black/5 flex items-center justify-center overflow-hidden group">
          <!-- Shimmer effect -->
          <div class="absolute inset-0 animate-shimmer"></div>
          
          <!-- Ícone/Mascote - usando emoji como placeholder -->
          <div class="relative text-7xl md:text-8xl z-10">
            <img src="../../public/logo.png" alt="Logo" class="w-40 h-40 object-contain">
          </div>
          
          <!-- Anel decorativo interno -->
          <div class="absolute inset-2 border-2 border-purple-100/40 rounded-[20px]"></div>
        </div>
        
        <!-- Anel decorativo externo -->
        <div class="absolute inset-[-8px] border border-purple-200/30 rounded-[28px]"></div>
      </div>
    </div>

    <!-- Título -->
    <div class="text-center mb-8 fade-item animate-fade-in-scale delay-300">
      <h1 class="text-5xl md:text-6xl lg:text-7xl font-semibold tracking-tight mb-3 gradient-text">
        Vestibuline
      </h1>
      <!-- Linha decorativa -->
      <div class="h-1.5 w-32 mx-auto rounded-full gradient-purple opacity-60"></div>
    </div>

    <!-- Loader Container -->
    <div class="mb-6 fade-item animate-fade-in-scale delay-400">
      <div class="relative flex items-center justify-center">
        <!-- Loader principal -->
        <div class="w-16 h-16 md:w-20 md:h-20 loader-ring"></div>
        
        <!-- Ponto central pulsante -->
        <div class="absolute w-3 h-3 rounded-full gradient-purple animate-pulse-slow"></div>
      </div>
    </div>

    <!-- Texto de status -->
    <div class="text-center space-y-4 fade-item animate-fade-in-scale delay-500">
      <p class="text-lg md:text-xl text-gray-600 font-medium">
        Iniciando ambiente de estudos...
      </p>
      
      <!-- Barra de progresso -->
      <div class="w-64 md:w-80 h-2 bg-gray-200 rounded-full overflow-hidden shadow-inner">
        <div class="h-full gradient-purple rounded-full animate-progress shadow-lg"></div>
      </div>
    </div>

    <!-- Indicadores de status (opcional) -->
    <div class="mt-12 flex items-center gap-6 fade-item animate-fade-in-scale delay-600">
      <!-- Status dots -->
      <div class="flex items-center gap-2">
        <div class="w-2 h-2 rounded-full bg-purple-500 animate-pulse"></div>
        <div class="w-2 h-2 rounded-full bg-purple-400 animate-pulse delay-100"></div>
        <div class="w-2 h-2 rounded-full bg-purple-300 animate-pulse delay-200"></div>
      </div>
    </div>

    <!-- Mensagem de carregamento -->
    <div class="mt-8 text-center fade-item animate-fade-in-scale delay-600">
      <p class="text-sm text-gray-500">
        Preparando seus <span class="font-semibold text-[#7431f6]">materiais de estudo</span>
      </p>
    </div>
  </div>

  <!-- Footer minimalista -->
  <div class="absolute bottom-8 left-1/2 -translate-x-1/2 text-center fade-item animate-fade-in-scale delay-600">
    <p class="text-xs text-gray-400">
      Powered by <span class="font-semibold text-[#7431f6]">Vestibuline</span>
    </p>
  </div>

  <!-- Script para controle de animações e redirecionamento -->
  <script>
    // Ativa animações após carregamento
    window.addEventListener('load', function() {
      setTimeout(() => {
        const items = document.querySelectorAll('.fade-item');
        items.forEach(item => {
          item.classList.remove('fade-item');
        });
      }, 100);
    });

    // Simula carregamento e redireciona (ajuste conforme necessário)
    setTimeout(() => {
      // Efeito de fade out antes de redirecionar
      document.body.style.transition = 'opacity 0.5s ease-out';
      document.body.style.opacity = '0';
      
      // Redireciona após fade (ajuste a URL conforme necessário)
      setTimeout(() => {
        window.location.href = '/'; // ou qualquer outra página
      }, 500);
    }, 4000); // 4 segundos de splash screen

    // Animação adicional no logo ao passar o mouse (desktop)
    const logo = document.querySelector('.group');
    if (logo) {
      logo.addEventListener('mouseenter', function() {
        this.style.transform = 'scale(1.05) rotate(3deg)';
        this.style.transition = 'transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1)';
      });
      logo.addEventListener('mouseleave', function() {
        this.style.transform = 'scale(1) rotate(0deg)';
      });
    }

    // Mensagens de status dinâmicas (opcional)
    const statusMessages = [
      'Carregando seus materiais...',
      'Preparando o ambiente...',
      'Iniciando sessão de estudos...',
      'Quase lá...'
    ];

    let messageIndex = 0;
    const statusText = document.querySelector('p.text-lg');
    
    setInterval(() => {
      if (messageIndex < statusMessages.length - 1) {
        statusText.style.opacity = '0';
        setTimeout(() => {
          messageIndex++;
          statusText.textContent = statusMessages[messageIndex];
          statusText.style.opacity = '1';
        }, 300);
      }
    }, 1000);
  </script>
</body>
</html>
