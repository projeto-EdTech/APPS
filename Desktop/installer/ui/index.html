<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Instalador Vestibuline</title>
    <link rel="stylesheet" href="global.css" />
    <link rel="stylesheet" href="style/index.css" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="relative">
    <!-- Janela Apple-like macOS -->
    <div
      class="modern-window relative"
      style="
        width: 600px;
        height: 560px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: white;
        box-shadow:
          0 10px 40px rgba(0, 0, 0, 0.12),
          0 0 1px rgba(0, 0, 0, 0.05);
        border: none;
      "
    >
      <!-- Traffic Lights - Apple Style -->
      <div
        class="window-controls no-select relative z-50 flex items-center justify-between px-6 pt-5"
        style="flex-shrink: 0"
      >
        <div class="flex gap-3 relative">
          <div
            class="traffic-dot close group relative"
            onclick="window.installerAPI?.closeApp()"
            title="Fechar"
            style="position: relative"
          ></div>
          <div
            class="traffic-dot minimize group relative"
            onclick="window.installerAPI?.minimizeApp()"
            title="Minimizar"
            style="position: relative"
          ></div>
          <div
            class="traffic-dot maximize group relative"
            onclick="window.installerAPI?.maximizeApp()"
            title="Maximizar"
            style="position: relative"
          ></div>
        </div>
      </div>

      <!-- Content Area - Apple Design System -->
      <div
        style="
          flex: 1;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          padding: 20px 40px;
          text-align: center;
          overflow-y: auto;
        "
      >
        <!-- Mascote com Glow Subtil -->
        <div
          class="fade-item animate-fade-in-up delay-100 mb-6 relative"
          style="flex-shrink: 0"
        >
          <div
            class="animate-float"
            style="
              width: 120px;
              height: 120px;
              display: flex;
              align-items: center;
              justify-content: center;
              position: relative;
            "
          >
            <!-- Glow Suave -->
            <div
              style="
                position: absolute;
                inset: -20px;
                background: radial-gradient(
                  circle,
                  rgba(123, 97, 255, 0.15) 0%,
                  transparent 70%
                );
                border-radius: 50%;
                filter: blur(24px);
              "
            ></div>
            <!-- Mascote -->
            <img
              src="../public/Mascote/banners/Camaleão_3.png"
              alt="Mascote Vestibuline"
              style="
                width: 120px;
                height: 120px;
                object-fit: contain;
                position: relative;
                z-index: 1;
              "
            />
          </div>
        </div>

        <!-- Título - Apple Typography -->
        <div
          class="fade-item animate-fade-in-up delay-200 mb-2"
          style="flex-shrink: 0"
        >
          <h1
            id="title"
            style="
              font-size: 32px;
              font-weight: 700;
              color: var(--apple-dark);
              line-height: 1.2;
              letter-spacing: -0.3px;
              margin: 0;
            "
          >
            Vestibuline APP
          </h1>
          <div
            style="
              height: 3px;
              width: 40px;
              margin: 8px auto 0;
              border-radius: 2px;
              background: linear-gradient(
                90deg,
                var(--apple-blue) 0%,
                var(--apple-purple) 100%
              );
            "
          ></div>
        </div>

        <!-- Subtítulo - Apple Body Text -->
        <p
          class="fade-item animate-fade-in-up delay-300"
          style="
            flex-shrink: 0;
            max-width: 420px;
            font-size: 15px;
            color: var(--apple-gray-text);
            line-height: 1.6;
            margin: 0;
            margin-bottom: 28px;
          "
        >
          Transforme seus estudos com
          <span style="font-weight: 600; color: var(--apple-blue)"
            >inteligência artificial</span
          >
          e
          <span style="font-weight: 600; color: var(--apple-purple)"
            >otimização</span
          >. Sua jornada rumo à aprovação começa aqui.
        </p>

        <!-- Botão Principal - Apple CTA -->
        <button
          id="installBtn"
          class="fade-item animate-fade-in-up delay-500 no-select apple-button"
          onclick="startInstallation()"
          style="
            flex-shrink: 0;
            padding: 10px 32px;
            background: linear-gradient(
              180deg,
              var(--apple-blue) 0%,
              #005fcc 100%
            );
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(0, 113, 227, 0.3);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
          "
        >
          <span id="installBtnText">Próximo</span>
        </button>
      </div>
    </div>
    <script src="script/index.js"></script>
  </body>
</html>
